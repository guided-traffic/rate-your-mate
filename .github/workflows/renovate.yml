name: Renovate Application
on:
  # # Täglich um 2 Uhr morgens UTC ausführen
  # schedule:
  #   - cron: '0 2 * * *'
  # # Nach jedem Push auf main
  # push:
  #   branches:
  #     - main
  # Manueller Trigger
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  renovate:
    runs-on: self-hosted
    steps:
      # GitHub App installation token (guided-traffic-automation), scoped to this
      # repository with all permissions of the app; expires after 1 h and is
      # revoked at the end of the job.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: renovate.json
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_AUTODISCOVER: 'true'
          RENOVATE_AUTODISCOVER_FILTER: 'guided-traffic/rate-your-mate'
          RENOVATE_REQUIRE_CONFIG: 'required'
